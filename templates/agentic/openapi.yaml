# Plantilla mínima OpenAPI 3.1 para un ADS con API HTTP. Errores en application/problem+json (RFC 9457).
openapi: 3.1.0
info:
  title: <Nombre del ADS> API
  version: 0.1.0
  description: <Una frase>
paths:
  /status:
    get:
      operationId: getStatus
      summary: Estado del ADS
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } }, required: [status] }
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Error estructurado (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://<idp>/oauth/token
          scopes: { "ads.read": "lectura", "ads.write": "escritura" }
security:
  - oauth2: [ads.read]
