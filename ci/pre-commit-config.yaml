# pre-commit-config.yaml — alternativa local y neutral a la CI (copia a .pre-commit-config.yaml).
# Instala una vez: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: abm-check
        name: ABM — abm check
        entry: python3 scripts/abm.py check
        language: system
        pass_filenames: false
      - id: abm-units
        name: ABM — unidades documentadas (completitud y work_log)
        entry: python3 scripts/abm.py units
        language: system
        pass_filenames: false
  # Añade un escáner de secretos dedicado como segundo repo si lo necesitas.
