# adapters/tools.yaml — herramientas para las que `abm sync` genera adaptadores (ADR 0002).
# Rutas y formatos verificados en docs/compat-matrix.md. Desactiva con enabled: false.
tools:
  claude-code: { enabled: true }
  codex: { enabled: true }
  antigravity: { enabled: true }
  copilot: { enabled: true }
  cursor: { enabled: true }
  gemini-cli: { enabled: true }
  windsurf: { enabled: true }
  kiro: { enabled: true }
  hermes: { enabled: true }

mcp_server:
  name: abm
  command: python3          # Windows: python (o py). Luego ejecuta abm.cmd sync.
  args: [scripts/abm.py, mcp]

# Metadatos por perfil: con `abm.yaml → active_profile`, `abm sync` no genera los comandos, skills ni roles
# que el perfil excluye (menos descripciones que cada herramienta carga por sesión). Siguen como fuentes neutrales
# en commands/, skills/ y agents/. Sin perfil activo (el propio ABM) se genera todo. Perfil compuesto (`composes:`):
# solo se excluye lo que excluyen todos sus componentes. Los perfiles sin entrada no excluyen nada.
profile_filters:
  api-service:
    commands: [ui, a11y]
    skills: [frontend-builder, a11y-audit]
    roles: [frontend]
  automation-integration:
    commands: [ui, a11y]
    skills: [frontend-builder, a11y-audit]
    roles: [frontend]
  research-report:
    commands: [ui, api, db, a11y, perf, refactor]
    skills: [frontend-builder, api-builder, db-builder, a11y-audit, perf-audit, observability-setup, test-strategy]
    roles: [frontend, backend]

ignore_patterns: [".env", ".env.*", "!.env.example", "*.pem", "*.key", "*.p12", "secrets/", "**/credentials*", "ops/audit/"]

# Plantillas turbo (ADR 0014): se escriben en adapters/turbo/ y solo se instalan con `abm sync --apply-turbo`.
# allow = solo lectura o verificación. Nada de cat/grep/find/head/tail por shell: saltarían el deny de lectura de secretos
# (el agente lee con su herramienta de lectura, que sí respeta deny_read).
turbo:
  allow_commands: ["./abm check", "./abm doctor", "./abm okf validate", "./abm ads-check", "./abm links", "./abm token-budget", "./abm lint", "./abm pending list", "./abm methodology classify", "./abm agent-conformance", "./abm sync --check", "./abm tokens report", "./abm tokens attest", "./abm tokens budget", "git status", "git diff", "git log", "git show", "ls", "wc"]
  ask_commands: ["git push", "git commit", "git reset", "git rebase", "rm", "mv", "npm publish", "pip install", "npm install", "curl", "wget"]
  deny_read: [".env", ".env.*", "**/*.pem", "**/*.key", "secrets/**"]
  deny_commands: ["git push --force", "git push -f", "rm -rf /", "sudo"]
